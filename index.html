  .pk-copy-all-btn {

  .pk-input-row { display: flex; gap: 6px; align-items: flex-start; }
  .pk-input-row .pk-input, .pk-input-row .pk-textarea { flex: 1; min-width: 0; }
  .pk-paste-btn {

  .pk-edit-banner {

  .pk-subject-hint {

  .pk-google-status {

</style>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const STORE_NAME = 'Dope Vibes';
  const LOGO_URL = 'https://tokodopevibes-ops.github.io/logo.png';
  const DRIVE_ICON_URL = 'https://tokodopevibes-ops.github.io/drive-icon.png';
  const BUKA_FOLDER_ICON_URL = 'https://tokodopevibes-ops.github.io/icon-buka-folder.png';
  const HISTORY_MAX_AGE_MS = 3 * 24 * 60 * 60 * 1000;
  const GMAIL_CLIENT_ID = '753578580309-9evb51u7eik50le85shf06lbdd0p3nia.apps.googleusercontent.com';
  const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.compose';
  const SHEETS_SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
  const OAUTH_SCOPES = `${GMAIL_SCOPE} ${SHEETS_SCOPE}`;
  const GOOGLE_ACCOUNT_LABEL = 'tokodopevibes@gmail.com';

  const [orderId, setOrderId] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [products, setProducts] = useState([{ name: '', link: '' }]);
  const [email, setEmail] = useState('');
  const [chat1Output, setChat1Output] = useState('');
  const [emailOutput, setEmailOutput] = useState('');
  const [emailHtml, setEmailHtml] = useState('');
  const [gmailToken, setGmailToken] = useState(null);
  const [gmailSending, setGmailSending] = useState(false);
  const DEFAULT_SHEET_ID = '1-DKmuh-f_pU9fiYNKlBcKvZoe6bCJJyveIDeJhOkxZg';
  const [sheetId, setSheetId] = useState(() => {
    try {
      const saved = localStorage.getItem('sheet_id');
      if (saved !== null) return saved;
      return DEFAULT_SHEET_ID;
    } catch (e) { return DEFAULT_SHEET_ID; }
  });
  const [sheetIdInput, setSheetIdInput] = useState('');
  const [sheetSyncing, setSheetSyncing] = useState(false);
  const tokenClientRef = useRef(null);
  const [activeTab, setActiveTab] = useState('email');
  const [toast, setToast] = useState('');
  const [history, setHistory] = useState([]);
  const toastTimer = useRef(null);

  function updateProduct(idx, field, value) {
    setProducts(prev => prev.map((p, i) => i === idx ? { ...p, [field]: value } : p));
  }
  function addProductRow() {
    setProducts(prev => [...prev, { name: '', link: '' }]);
  }
  function removeProductRow(idx) {
    setProducts(prev => prev.length === 1 ? prev : prev.filter((_, i) => i !== idx));
  }

  async function pasteFromClipboard() {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text) return text.trim();
      }
    } catch (e) {}
    showToast('Tidak bisa akses clipboard otomatis, tempel manual (tekan lama > Tempel)');
    return null;
  }

  async function pasteInto(setter) {
    const text = await pasteFromClipboard();
    if (text !== null) setter(text);
  }

  async function pasteIntoProduct(idx, field) {
    const text = await pasteFromClipboard();
    if (text !== null) updateProduct(idx, field, text);
  }

  function resetForm() {
    setOrderId('');
    setEditingId(null);
    setProducts([{ name: '', link: '' }]);
    setEmail('');
    setChat1Output('');
    setEmailOutput('');
    setEmailHtml('');
  }

  useEffect(() => { loadHistory(); }, []);

  const GMAIL_TOKEN_KEY = 'gmail_token_cache';

  function saveTokenCache(token, expiresInSec) {
    try {
      const expiresAt = Date.now() + (expiresInSec || 3500) * 1000;
      localStorage.setItem(GMAIL_TOKEN_KEY, JSON.stringify({ token, expiresAt }));
    } catch (e) {}
  }

  function loadTokenCache() {
    try {
      const raw = localStorage.getItem(GMAIL_TOKEN_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (data && data.token && data.expiresAt > Date.now() + 60000) return data;
      return null;
    } catch (e) {
      return null;
    }
  }

  useEffect(() => {
    const cached = loadTokenCache();
    if (cached) setGmailToken(cached.token);
  }, []);

  useEffect(() => {
    function initTokenClient() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2 && !tokenClientRef.current) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: GMAIL_CLIENT_ID,
          scope: OAUTH_SCOPES,
          callback: (resp) => {
            if (resp && resp.access_token) {
              setGmailToken(resp.access_token);
              saveTokenCache(resp.access_token, resp.expires_in);
              showToast('Berhasil login Gmail');
            } else {
              showToast('Login Gmail gagal atau dibatalkan');
            }
          },
        });
      }
    }
    if (window.google && window.google.accounts) {
      initTokenClient();
    } else {
      const iv = setInterval(() => {
        if (window.google && window.google.accounts) {
          initTokenClient();
          clearInterval(iv);
        }
      }, 300);
      return () => clearInterval(iv);
    }
  }, []);

  function loginGmail() {
    if (tokenClientRef.current) {
      tokenClientRef.current.requestAccessToken();
    } else {
      showToast('Google belum siap, coba lagi sebentar');
    }
  }

  function reloginGmail() {
    setGmailToken(null);
    try { localStorage.removeItem(GMAIL_TOKEN_KEY); } catch (e) {}
    if (tokenClientRef.current) {
      tokenClientRef.current.requestAccessToken({ prompt: 'consent' });
    } else {
      showToast('Google belum siap, coba lagi sebentar');
    }
  }

  function base64UrlEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function buildMimeMessage(to, subject, textBody, htmlBody) {
    const boundary = 'pk_boundary_' + Date.now();
    const headers = [
      `To: ${to}`,
      `Subject: =?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=`,
      'MIME-Version: 1.0',
      `Content-Type: multipart/alternative; boundary="${boundary}"`,
    ].join('\r\n');
    const textPart = `--${boundary}\r\nContent-Type: text/plain; charset="UTF-8"\r\n\r\n${textBody}\r\n`;
    const htmlPart = `--${boundary}\r\nContent-Type: text/html; charset="UTF-8"\r\n\r\n${htmlBody}\r\n`;
    const closing = `--${boundary}--`;
    return `${headers}\r\n\r\n${textPart}${htmlPart}${closing}`;
  }

  async function gmailApiRequest(path, options) {
    const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/${path}`, {
      ...options,
      headers: {
        'Authorization': `Bearer ${gmailToken}`,
        'Content-Type': 'application/json',
        ...(options && options.headers ? options.headers : {}),
      },
    });
    if (res.status === 401) {
      setGmailToken(null);
      try { localStorage.removeItem(GMAIL_TOKEN_KEY); } catch (e) {}
      throw new Error('SESSION_EXPIRED');
    }
    if (!res.ok) {
      const errData = await res.json().catch(() => null);
      throw new Error((errData && errData.error && errData.error.message) || String(res.status));
    }
    return res.json();
  }

  function saveSheetId(id) {
    const clean = id.trim();
    try { localStorage.setItem('sheet_id', clean); } catch (e) {}
    setSheetId(clean);
    setSheetIdInput('');
    showToast(clean ? 'Spreadsheet tersambung' : 'Spreadsheet dilepas');
  }

  async function logOrderToSheet(o, productList, e) {
    if (!sheetId) return { skipped: true };
    if (!gmailToken) { loginGmail(); return { skipped: true }; }
    const tanggal = formatDateID(Date.now());
    const produkText = productList.map(p => p.name).join('; ');
    const row = [tanggal, o, e, produkText, String(productList.length)];
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${gmailToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ values: [row] }),
      }
    );
    if (res.status === 401) {
      setGmailToken(null);
      try { localStorage.removeItem(GMAIL_TOKEN_KEY); } catch (err) {}
      throw new Error('SESSION_EXPIRED');
    }
    if (!res.ok) {
      const errData = await res.json().catch(() => null);
      throw new Error((errData && errData.error && errData.error.message) || String(res.status));
    }
    return res.json();
  }

  async function catatKeSheet() {
    if (!sheetId) { showToast('Sambungkan Spreadsheet ID dulu'); return; }
    if (!gmailToken) { loginGmail(); return; }
    const cleanProducts = products.filter(p => p.name.trim()).map(p => ({ name: p.name.trim(), link: p.link.trim() }));
    if (!orderId.trim() || !email.trim() || cleanProducts.length === 0) {
      showToast('Lengkapi data pesanan dulu');
      return;
    }
    setSheetSyncing(true);
    try {
      await logOrderToSheet(orderId.trim(), cleanProducts, email.trim());
      showToast('Tercatat di Spreadsheet!');
    } catch (e) {
      if (e.message === 'SESSION_EXPIRED') showToast('Sesi Google habis, silakan login lagi');
      else showToast('Gagal mencatat: ' + e.message);
    } finally {
      setSheetSyncing(false);
    }
  }

  async function sendToGmailDraft() {
    if (!gmailToken) { loginGmail(); return; }
    if (!emailHtml || !email.trim()) { showToast('Lengkapi data pesanan dulu'); return; }
    setGmailSending(true);
    try {
      const subject = `Akses Folder Pesanan #${orderId.trim()}`;
      const mime = buildMimeMessage(email.trim(), subject, emailOutput, emailHtml);
      const raw = base64UrlEncode(mime);
      await gmailApiRequest('drafts', { method: 'POST', body: JSON.stringify({ message: { raw } }) });
      let sheetNote = '';
      if (sheetId) {
        try {
          const cleanProducts = products.filter(p => p.name.trim()).map(p => ({ name: p.name.trim(), link: p.link.trim() }));
          await logOrderToSheet(orderId.trim(), cleanProducts, email.trim());
          sheetNote = ' & tercatat di Spreadsheet';
        } catch (se) {}
      }
      showToast('Draft berhasil dibuat di Gmail' + sheetNote + '!');
    } catch (e) {
      if (e.message === 'SESSION_EXPIRED') showToast('Sesi Gmail habis, silakan login lagi');
      else showToast('Gagal buat draft: ' + e.message);
    } finally {
      setGmailSending(false);
    }
  }

  async function sendGmailNow() {
    if (!gmailToken) { loginGmail(); return; }
    if (!emailHtml || !email.trim()) { showToast('Lengkapi data pesanan dulu'); return; }
    const confirmed = window.confirm(`Kirim email langsung ke ${email.trim()} sekarang? Email akan langsung terkirim, tidak bisa dibatalkan.`);
    if (!confirmed) return;
    setGmailSending(true);
    try {
      const subject = `Akses Folder Pesanan #${orderId.trim()}`;
      const mime = buildMimeMessage(email.trim(), subject, emailOutput, emailHtml);
      const raw = base64UrlEncode(mime);
      const draft = await gmailApiRequest('drafts', { method: 'POST', body: JSON.stringify({ message: { raw } }) });
      await gmailApiRequest('drafts/send', { method: 'POST', body: JSON.stringify({ id: draft.id }) });
      let sheetNote = '';
      if (sheetId) {
        try {
          const cleanProducts = products.filter(p => p.name.trim()).map(p => ({ name: p.name.trim(), link: p.link.trim() }));
          await logOrderToSheet(orderId.trim(), cleanProducts, email.trim());
          sheetNote = ' & tercatat di Spreadsheet';
        } catch (se) {}
      }
      showToast('Email berhasil terkirim ke pembeli' + sheetNote + '!');
    } catch (e) {
      if (e.message === 'SESSION_EXPIRED') showToast('Sesi Gmail habis, silakan login lagi');
      else showToast('Gagal kirim email: ' + e.message);
    } finally {
      setGmailSending(false);
    }
  }

  function loadHistory() {
    try {
      const items = [];
      const staleKeys = [];
      const now = Date.now();
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('order:') === 0) {
          try {
            const raw = localStorage.getItem(k);
            if (raw) {
              const rec = JSON.parse(raw);
              if (now - (rec.ts || 0) > HISTORY_MAX_AGE_MS) {
                staleKeys.push(k);
              } else {
                items.push(rec);
              }
            }
          } catch (e) {}
        }
      }
      staleKeys.forEach(k => localStorage.removeItem(k));
      items.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      setHistory(items);
    } catch (e) {
      setHistory([]);
    }
  }

  function buildChatMessage1(e) {
    return `Gmail : [ ${e} ]

Silakan cek inbox email Anda (jika belum masuk, coba cek folder Spam/Promosi juga), undangan akses folder sudah admin kirimkan melalui Gmail.

Setelah klik tombol "Buka Folder" pada email tersebut, Anda bisa menemukan foldernya di aplikasi Google Drive pada bagian \u201cShared\u201d atau \u201cDibagikan kepada saya\u201d.

Silakan dicek dahulu ya, apabila mengalami kendala bisa langsung chat kami, terima kasih banyak atas pesanannya \ud83d\ude4f\ud83d\ude4c`;
  }

  function buildEmail(o, productList, e) {
    const items = productList.map((p, i) => `${i + 1}. ${p.name}\n   Link folder : ${p.link}`).join('\n\n');
    const itemLabel = productList.length > 1 ? `${productList.length} item` : '1 item';
    return `Yth. ${e},

Terima kasih telah berbelanja di ${STORE_NAME}. Pesanan Anda telah kami proses dan folder unduhan sudah kami bagikan ke alamat email ini.

No. Pesanan   : ${o}
Total Produk  : ${itemLabel}

${items}

Klik tombol "Buka Folder" di atas untuk dapat mengakses folder file. Setelah itu, folder juga akan muncul di aplikasi/situs Google Drive Anda pada bagian "Shared" atau "Dibagikan kepada saya".

Apabila mengalami kendala akses, silakan balas email ini atau hubungi kami melalui chat Shopee, tim kami siap membantu!

Salam hangat,
${STORE_NAME}
This is an automated email confirming the delivery of your digital order.`;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function buildEmailHTML(o, productList, e) {
    const itemLabel = productList.length > 1 ? `${productList.length} item` : '1 item';
    const itemsHtml = productList.map((p, i) => `
      <div style="background:#faf8f2;border:1px solid #ece4cf;border-radius:10px;padding:18px 20px;margin:0 0 14px;">
        <p style="margin:0 0 14px;font-size:14px;font-weight:700;color:#1c1f18;font-family:Arial,Helvetica,sans-serif;">${i + 1}. ${escapeHtml(p.name)}</p>
        <a href="${escapeHtml(p.link)}" style="display:inline-block;text-decoration:none;"><img src="${BUKA_FOLDER_ICON_URL}" width="260" alt="Buka Folder" style="display:block;width:260px;max-width:100%;height:auto;border:0;" /></a>
      </div>`).join('');

    return `<div style="max-width:560px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;">
  <div style="background:#0b0b0b;padding:36px 20px;text-align:center;border-radius:14px 14px 0 0;">
    <img src="${LOGO_URL}" width="300" alt="${STORE_NAME}" style="display:block;margin:0 auto;max-width:300px;height:auto;" />
  </div>
  <div style="height:3px;background-color:#c9a227;"></div>
  <div style="background:#ffffff;border:1px solid #e7e2d3;border-top:none;padding:36px 32px;border-radius:0 0 14px 14px;">
    <p style="margin:0 0 18px;font-size:14px;color:#1c1f18;">Yth. <strong>${escapeHtml(e)}</strong>,</p>
    <p style="margin:0 0 26px;font-size:14px;line-height:1.7;color:#3a4034;">Terima kasih telah berbelanja di <strong>${STORE_NAME}</strong>. Pesanan Anda telah kami proses dan folder unduhan sudah kami bagikan ke alamat email ini.</p>
    <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#c9a227;">Ringkasan Pesanan</p>
    <div style="background:#faf8f2;border:1px solid #ece4cf;border-radius:10px;padding:16px 20px;margin:0 0 28px;font-size:13px;color:#3a4034;">
      <div style="padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #ece4cf;"><strong>No. Pesanan</strong> &nbsp;${escapeHtml(o)}</div>
      <div><strong>Total Produk</strong> &nbsp;${itemLabel}</div>
    </div>
    ${itemsHtml}
    <p style="font-size:13px;color:#6b7264;line-height:1.7;margin:22px 0 0;">Klik tombol &ldquo;Buka Folder&rdquo; di atas untuk dapat mengakses folder file. Setelah itu, folder juga akan muncul di aplikasi/situs Google Drive Anda pada bagian &ldquo;Shared&rdquo; atau &ldquo;Dibagikan kepada saya&rdquo;.</p>
    <p style="font-size:13px;color:#6b7264;line-height:1.7;margin:14px 0 0;">Apabila mengalami kendala akses, silakan balas email ini atau hubungi kami melalui chat Shopee, tim kami siap membantu!</p>
    <div style="height:1px;background-color:#ece4cf;margin:28px 0 22px;"></div>
    <p style="font-size:13px;color:#1c1f18;margin:0;">Salam hangat,<br/><strong>${STORE_NAME}</strong></p>
  </div>
  <p style="text-align:center;font-size:11px;color:#9aa08e;margin:16px 0 0;">This is an automated email confirming the delivery of your digital order.</p>
</div>`;
  }

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 1800);
  }

  function handleGenerate() {
    const cleanProducts = products
      .map(p => ({ name: p.name.trim(), link: p.link.trim() }))
      .filter(p => p.name);
    if (!orderId.trim() || cleanProducts.length === 0 || !email.trim()) {
      showToast('Isi No. Pesanan, minimal 1 produk, dan email');
      return;
    }
    const missingLink = cleanProducts.some(p => !p.link);
    setChat1Output(buildChatMessage1(email.trim()));
    setEmailOutput(missingLink ? '' : buildEmail(orderId.trim(), cleanProducts, email.trim()));
    setEmailHtml(missingLink ? '' : buildEmailHTML(orderId.trim(), cleanProducts, email.trim()));
    if (missingLink) showToast('Link folder ada yang kosong \u2014 email dilewati');
    const finalId = orderId.trim();
    const record = { orderId: finalId, email: email.trim(), products: cleanProducts, ts: Date.now() };
    try {
      if (editingId && editingId !== finalId) {
        localStorage.removeItem('order:' + editingId);
      }
      localStorage.setItem('order:' + finalId, JSON.stringify(record));
      setEditingId(finalId);
      loadHistory();
    } catch (e) {}
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copyText(text) {
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Tersalin ke clipboard');
      }).catch(() => {
        if (fallbackCopy(text)) showToast('Tersalin ke clipboard');
        else showToast('Gagal menyalin, coba manual');
      });
    } else {
      if (fallbackCopy(text)) showToast('Tersalin ke clipboard');
      else showToast('Gagal menyalin, coba manual');
    }
  }

  function copyEmailRich(html, text) {
    if (!html) return;
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        const item = new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([text], { type: 'text/plain' })
        });
        navigator.clipboard.write([item]).then(() => {
          showToast('Email tersalin, siap tempel ke Gmail');
        }).catch(() => {
          copyText(text);
        });
        return;
      }
    } catch (e) {}
    copyText(text);
  }

  function getItemProducts(item) {
    if (Array.isArray(item.products)) {
      return item.products.map(p => typeof p === 'string' ? { name: p, link: '' } : p);
    }
    if (item.product) return [{ name: item.product, link: '' }];
    return [];
  }

  function loadFromHistory(item) {
    const p = getItemProducts(item);
    setOrderId(item.orderId);
    setEditingId(item.orderId);
    setProducts(p.length ? p : [{ name: '', link: '' }]);
    setEmail(item.email);
    setChat1Output(buildChatMessage1(item.email));
    const hasAllLinks = p.length > 0 && p.every(x => x.link);
    setEmailOutput(hasAllLinks ? buildEmail(item.orderId, p, item.email) : '');
    setEmailHtml(hasAllLinks ? buildEmailHTML(item.orderId, p, item.email) : '');
  }

  function deleteHistoryItem(orderIdKey) {
    try {
      localStorage.removeItem('order:' + orderIdKey);
      if (editingId === orderIdKey) resetForm();
      loadHistory();
    } catch (e) {}
  }

  const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  function formatDateID(ts) {
    const d = new Date(ts || Date.now());
    return `${d.getDate()} ${BULAN_ID[d.getMonth()]} ${d.getFullYear()}`;
  }

  function dateKey(ts) {
    const d = new Date(ts || Date.now());
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function groupHistoryByDate(items) {
    const groups = {};
    for (const item of items) {
      const key = dateKey(item.ts);
      if (!groups[key]) groups[key] = { key, label: formatDateID(item.ts), ts: item.ts, items: [] };
      groups[key].items.push(item);
    }
    return Object.values(groups).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  }

  const tabContent = {
    chat1: { text: chat1Output, label: 'Pesan Chat Shopee', empty: '' },
    email: { text: emailOutput, label: 'Teks Email', empty: 'Lengkapi link folder di setiap produk untuk membuat teks email.' },
  };
  const currentOutput = tabContent[activeTab].text;

  return (
    <div>
      <p className="pk-eyebrow">Pengiriman Pesanan Digital</p>
      <h1 className="pk-title">Generator Pesan &amp; Email</h1>

      <div className={"pk-google-status " + (gmailToken ? 'ok' : 'off')}>
        <span className="pk-google-status-text">
          {gmailToken
            ? `\u2705 Google tersambung (${GOOGLE_ACCOUNT_LABEL}) \u2014 Gmail & Spreadsheet aktif`
            : '\u26a0\ufe0f Belum login Google \u2014 diperlukan untuk kirim otomatis & catat ke Spreadsheet'}
        </span>
        <button className="pk-google-status-btn" onClick={gmailToken ? reloginGmail : loginGmail}>
          {gmailToken ? 'Login Ulang' : 'Login Sekarang'}
        </button>
      </div>

      {editingId && (
        <div className="pk-edit-banner">
          <span>Mengedit pesanan {editingId}</span>
          <button className="pk-edit-cancel" onClick={resetForm}>Batal / Formulir Baru</button>
        </div>
      )}

      <div className="pk-field">
        <label className="pk-label">No. Pesanan</label>
        <div className="pk-input-row">
          <input className="pk-input" value={orderId} onChange={e => setOrderId(e.target.value)} placeholder="Masukkan nomor pesanan dari Shopee" />
          <button className="pk-paste-btn" onClick={() => pasteInto(setOrderId)}>Tempel</button>
        </div>
      </div>

      <div className="pk-field">
        <label className="pk-label">Email Pembeli (untuk share akses Drive &amp; arsip riwayat)</label>
        <div className="pk-input-row">
          <input className="pk-input" value={email} onChange={e => setEmail(e.target.value)} placeholder="Salin dari catatan pesanan Shopee" />
          <button className="pk-paste-btn" onClick={() => pasteInto(setEmail)}>Tempel</button>
        </div>
      </div>

      <div className="pk-field">
        <label className="pk-label">Produk &amp; Link Folder {products.length > 1 ? `(${products.length} item)` : ''}</label>
        {products.map((p, idx) => (
          <div className="pk-product-block" key={idx}>
            {products.length > 1 && (
              <button className="pk-remove-x" onClick={() => removeProductRow(idx)} aria-label="Hapus produk ini">&times;</button>
            )}
            <div className="pk-input-row" style={{ marginBottom: '6px' }}>
              <textarea
                className="pk-textarea"
                value={p.name}
                onChange={e => updateProduct(idx, 'name', e.target.value)}
                placeholder="Tulis nama produk yang dibeli"
                style={{ minHeight: '40px' }}
              />
              <button className="pk-paste-btn" onClick={() => pasteIntoProduct(idx, 'name')}>Tempel</button>
            </div>
            <div className="pk-input-row">
              <input
                className="pk-input pk-product-link"
                value={p.link}
                onChange={e => updateProduct(idx, 'link', e.target.value)}
                placeholder="Tempel link folder Google Drive di sini"
              />
              <button className="pk-paste-btn" onClick={() => pasteIntoProduct(idx, 'link')}>Tempel</button>
            </div>
          </div>
        ))}
        <button className="pk-add-btn" onClick={addProductRow}>+ Tambah Produk</button>
      </div>

      <button className="pk-btn" onClick={handleGenerate}>{editingId ? 'Simpan Perubahan' : 'Buat Pesan & Email'}</button>

      {(chat1Output || emailOutput) && (
        <div className="pk-output-wrap">
          <div className="pk-tabs">
            <button className={"pk-tab" + (activeTab === 'email' ? ' active' : '')} onClick={() => setActiveTab('email')}>Email</button>
            <button className={"pk-tab" + (activeTab === 'chat1' ? ' active' : '')} onClick={() => setActiveTab('chat1')}>Chat Shopee</button>
          </div>
          {activeTab === 'email' && emailOutput && (
            <p className="pk-subject-hint">Subjek disarankan: <b>Akses Folder Pesanan #{orderId.trim()}</b></p>
          )}
          {activeTab === 'email' ? (
            emailHtml ? (
              <div className="pk-email-preview" dangerouslySetInnerHTML={{ __html: emailHtml }} />
            ) : (
              <div className="pk-output">{tabContent.email.empty}</div>
            )
          ) : (
            <div className="pk-output">{currentOutput || tabContent[activeTab].empty}</div>
          )}
          <div className="pk-copy-row">
            {activeTab === 'email' ? (
              <>
                <button className="pk-btn" onClick={() => copyEmailRich(emailHtml, emailOutput)}>Salin Email (siap tempel)</button>
                <button className="pk-hi-btn" onClick={() => copyText(emailOutput)}>Salin sbg teks polos</button>
              </>
            ) : (
              <button className="pk-btn" onClick={() => copyText(currentOutput)}>Salin {tabContent[activeTab].label}</button>
            )}
          </div>
          {activeTab === 'email' && emailHtml && (
            <div className="pk-gmail-row">
              {gmailToken ? (
                <button className="pk-btn pk-gmail-send-btn" onClick={sendGmailNow} disabled={gmailSending}>
                  {gmailSending ? 'Memproses...' : 'Kirim ke Pembeli & Catat'}
                </button>
              ) : (
                <button className="pk-btn pk-gmail-btn" onClick={loginGmail}>Login Gmail untuk kirim otomatis</button>
              )}
            </div>
          )}
          <div className="pk-sheet-settings">
            {sheetId ? (
              <p className="pk-sheet-status">Spreadsheet tersambung ({sheetId.slice(0, 10)}...) <button className="pk-link-btn" onClick={() => saveSheetId('')}>Lepas</button></p>
            ) : (
              <div className="pk-sheet-connect">
                <input
                  type="text"
                  className="pk-sheet-input"
                  placeholder="Tempel Spreadsheet ID di sini"
                  value={sheetIdInput}
                  onChange={ev => setSheetIdInput(ev.target.value)}
                />
                <button className="pk-hi-btn" onClick={() => saveSheetId(sheetIdInput)}>Sambungkan</button>
              </div>
            )}
          </div>
        </div>
      )}


      <div className="pk-toast">{toast}</div>

      <div className="pk-history">
        <p className="pk-history-title">Riwayat Terakhir <span style={{ fontWeight: 400, textTransform: 'none' }}>(otomatis terhapus setelah 3 hari)</span></p>
        {history.length === 0 && <p className="pk-empty">Belum ada pesan yang dibuat.</p>}
        {groupHistoryByDate(history).map(group => (
          <div className="pk-history-group" key={group.key}>
            <div className="pk-history-head">
              <p className="pk-history-date">{group.label}</p>
              <button className="pk-hi-btn pk-copy-all-btn" onClick={() => copyText(group.items.map(h => h.orderId).join('\n'))}>Salin No. ({group.items.length})</button>
            </div>
            {group.items.map(item => {
              const p = getItemProducts(item);
              const subLabel = p.length > 1 ? `${p.length} produk: ${p[0].name}, ...` : (p[0] ? p[0].name : '');
              return (
                <div className="pk-history-item" key={item.orderId}>
                  <div className="pk-hi-main">
                    <div className="pk-hi-order">{item.orderId}{item.email ? ` \u00b7 ${item.email}` : ''}</div>
                    <div className="pk-hi-sub">{subLabel}</div>
                  </div>
                  <div className="pk-hi-actions">
                    <button className="pk-hi-btn" onClick={() => copyText(item.orderId)}>Salin No.</button>
                    <button className="pk-hi-btn" onClick={() => loadFromHistory(item)}>Edit</button>
                    <button className="pk-hi-btn" onClick={() => deleteHistoryItem(item.orderId)}>Hapus</button>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
